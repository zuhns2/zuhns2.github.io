<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zuhn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1:#3a1060; --bg2:#16061f; --bg3:#07020d;
    --pink:#ff8fd8; --violet:#b58cff; --fg:#fff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; }
  body {
    color:var(--fg);
    font-family:'Oswald','Arial Narrow',Impact,sans-serif;
    background:radial-gradient(ellipse at 50% 0%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%) fixed;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:70px 16px 24px; overflow-x:hidden; position:relative;
  }
  main, footer { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; }

  /* ---------- 3D логотип + маленький motion blur (призраки с отставанием) ---------- */
  .stage { position:relative; width:150px; height:150px; margin-bottom:50px; filter:drop-shadow(0 0 14px rgba(255,120,220,.65)); }
  .ghost { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; perspective:800px; }
  .ghost.g1 { opacity:.32; } .ghost.g2 { opacity:.2; } .ghost.g3 { opacity:.1; }
  .logo { position:relative; width:120px; height:120px; transform-style:preserve-3d; animation:spin 3s linear infinite; }
  .glyph { position:absolute; transform-style:preserve-3d; }
  .glyph svg { position:absolute; inset:0; width:100%; height:100%; fill:#e3b4ff; }
  .glyph svg.face { fill:#fff; }
  @keyframes spin { from { transform:rotateY(0); } to { transform:rotateY(360deg); } }

  /* ---------- кнопки ---------- */
  nav { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .btn {
    display:inline-flex; align-items:center; gap:10px;
    padding:12px 26px; min-width:96px; justify-content:center;
    color:var(--fg); text-decoration:none; background:rgba(20,6,32,.75);
    border:2px solid var(--pink); border-radius:4px;
    font-size:22px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    box-shadow:0 0 12px rgba(255,143,216,.6), 0 0 28px rgba(181,140,255,.25), inset 0 0 8px rgba(181,140,255,.3);
    transition:background .15s, color .15s, transform .15s, box-shadow .15s, border-color .15s;
  }
  .btn svg { width:26px; height:26px; fill:currentColor; flex:none; }
  .btn svg.s { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  .btn:hover, .btn:focus-visible {
    background:linear-gradient(90deg,var(--pink),var(--violet)); color:#1a0826; border-color:#fff;
    transform:scale(1.06); box-shadow:0 0 26px rgba(255,143,216,.95); outline:none;
  }

  /* ---------- обо мне ---------- */
  .about {
    margin-top:44px; width:min(92vw,440px); padding:20px 22px;
    background:rgba(24,8,40,.72); border:2px solid rgba(181,140,255,.8); border-radius:6px;
    box-shadow:0 0 18px rgba(181,140,255,.45), inset 0 0 10px rgba(255,143,216,.18);
    backdrop-filter:blur(3px);
  }
  .about h2 { font-size:22px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:12px; text-shadow:0 0 10px rgba(255,143,216,.8); }
  .about dl { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:18px; font-weight:400; letter-spacing:.03em; }
  .about dt { color:var(--pink); text-transform:uppercase; font-weight:500; }
  .about dd { color:#f4e8ff; }
  .about p { margin-top:12px; font-size:17px; font-weight:400; line-height:1.45; color:#f4e8ff; }

  footer { margin-top:auto; padding-top:60px; font-size:20px; font-weight:700; letter-spacing:.08em; text-shadow:0 0 12px rgba(255,143,216,.8); }

  /* ---------- сакура ---------- */
  .tree { position:fixed; bottom:0; z-index:1; width:min(48vw,460px); height:auto; pointer-events:none; opacity:.9; filter:drop-shadow(0 0 10px rgba(255,120,200,.25)); }
  .tree.l { left:-20px; } .tree.r { right:-20px; transform:scaleX(-1); }

  .petal {
    position:fixed; top:-30px; z-index:3; pointer-events:none;
    width:var(--s); height:calc(var(--s) * .75);
    background:linear-gradient(135deg,#ffd3f0,#ff8fd8);
    border-radius:150% 0 150% 0; opacity:.85;
    filter:blur(.7px); /* лёгкий motion blur */
    animation:fall var(--d) linear var(--dl) infinite;
  }
  .petal::after { /* шлейф */
    content:""; position:absolute; left:50%; bottom:100%; width:2px; height:calc(var(--s) * 1.8);
    background:linear-gradient(to top, rgba(255,160,225,.35), transparent); transform:translateX(-50%); filter:blur(1px);
  }
  @keyframes fall {
    0%   { transform:translate3d(0,-5vh,0) rotate(0deg); }
    50%  { transform:translate3d(calc(var(--dx) * .5),55vh,0) rotate(300deg); }
    100% { transform:translate3d(var(--dx),110vh,0) rotate(640deg); }
  }

  @media (max-width:520px) { .tree { width:56vw; opacity:.55; } .btn { font-size:20px; } }
  @media (prefers-reduced-motion:reduce) { .logo { animation:none; transform:rotateY(-25deg); } .petal { display:none; } .ghost.g1,.ghost.g2,.ghost.g3 { display:none; } }
</style>
</head>
<body>

<svg class="tree l" id="treeL" viewBox="0 0 400 520" aria-hidden="true"></svg>
<svg class="tree r" id="treeR" viewBox="0 0 400 520" aria-hidden="true"></svg>
<div id="petals" aria-hidden="true"></div>

<main>
  <div class="stage" id="stage" aria-hidden="true"></div>

  <nav>
    <a class="btn" href="https://t.me/zuhn2" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M9.8 15.6l-.4 4.1c.6 0 .9-.3 1.2-.6l2.9-2.7 6 4.4c1.1.6 1.9.3 2.2-1L24 3.9c.4-1.6-.6-2.2-1.6-1.8L1.2 10.2c-1.5.6-1.5 1.4-.3 1.8l5.4 1.7L18.9 6c.6-.4 1.1-.2.7.2z"/></svg>
      Telegram
    </a>
    <a class="btn" href="https://t.me/zuhnbuybot" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zm0 2h12l1.5 2h-15zm6 7a3 3 0 01-3-3H7a5 5 0 0010 0h-2a3 3 0 01-3 3z"/></svg>
      Telegram Shop
    </a>
    <a class="btn" href="https://steamcommunity.com/id/zuhns2/" target="_blank" rel="noopener">
      <svg class="s" viewBox="0 0 24 24"><circle cx="15.5" cy="8.5" r="4.5"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/><path d="M11.8 11.6L5.5 14.4"/><circle cx="6.8" cy="17.2" r="2.6"/></svg>
      Steam profile
    </a>
  </nav>

  <section class="about">
    <h2>Обо мне</h2>
    <dl>
      <dt>Имя</dt><dd>zuhn (псевдоним, сохраняю анонимность)</dd>
      <dt>Возраст</dt><dd>16 лет</dd>
      <dt>Люблю</dt><dd>вайбкодинг, КС, музыку</dd>
    </dl>
    <p>Просто чиловый парень: пишу код на вайбе, катаю в КС и слушаю музыку.</p>
  </section>
</main>

<footer>ZUHN2.GITHUB.IO © <span id="y">2026</span></footer>

<script>
  /* ===== Логотип: три Z, выдавленные слоями; 3 копии с отставанием дают лёгкий motion blur ===== */
  const SHAPE = "M0 0H40V8L14 32H40V40H0V32L26 8H0Z";
  const GLYPHS = [ { x:4, y:80, s:26 }, { x:30, y:42, s:38 }, { x:64, y:4, s:52 } ];
  const LAYERS = 14, NS = 'http://www.w3.org/2000/svg';
  function buildLogo(delay) {
    const logo = document.createElement('div');
    logo.className = 'logo';
    logo.style.animationDelay = delay + 's';
    GLYPHS.forEach(g => {
      const wrap = document.createElement('div');
      wrap.className = 'glyph';
      Object.assign(wrap.style, { left:g.x+'px', top:g.y+'px', width:g.s+'px', height:g.s+'px' });
      const depth = g.s * 0.22;
      for (let i = 0; i < LAYERS; i++) {
        const n = document.createElementNS(NS, 'svg');
        n.setAttribute('viewBox', '0 0 40 40');
        if (i === 0 || i === LAYERS - 1) n.setAttribute('class', 'face');
        n.style.transform = 'translateZ(' + ((i/(LAYERS-1) - 0.5) * depth).toFixed(2) + 'px)';
        n.innerHTML = '<path d="' + SHAPE + '"/>';
        wrap.appendChild(n);
      }
      logo.appendChild(wrap);
    });
    return logo;
  }
  const stage = document.getElementById('stage');
  [['g3',-2.94],['g2',-2.955],['g1',-2.97],['main',0]].forEach(([cls, d]) => {
    const box = document.createElement('div');
    box.className = 'ghost ' + (cls === 'main' ? '' : cls);
    box.appendChild(buildLogo(d));
    stage.appendChild(box);
  });

  /* ===== Деревья сакуры ===== */
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function sakura(svg, seed) {
    const r = rng(seed), C = ['#ffc2e8','#ff9fd8','#ffb3e0','#f58cc9','#ffd9f2','#d9a3ff'];
    let h = '';
    h += '<g fill="none" stroke="#2a1233" stroke-linecap="round">';
    h += '<path d="M120 520 C130 430 100 380 140 300 C160 250 150 200 190 150" stroke-width="22"/>';
    h += '<path d="M135 410 C190 380 240 360 300 300" stroke-width="12"/>';
    h += '<path d="M145 330 C90 290 60 250 40 190" stroke-width="10"/>';
    h += '<path d="M165 250 C220 230 260 190 330 170" stroke-width="9"/>';
    h += '<path d="M190 150 C200 100 230 70 270 40" stroke-width="8"/>';
    h += '<path d="M150 280 C140 220 110 170 120 110" stroke-width="7"/>';
    h += '</g>';
    const crowns = [[290,280,80,60,50],[60,190,60,50,36],[320,160,70,50,42],[265,50,60,45,34],[120,110,60,50,36],[190,170,70,60,44],[200,330,60,40,24]];
    crowns.forEach(([cx,cy,rx,ry,n]) => {
      for (let i = 0; i < n; i++) {
        const a = r()*6.283, d = Math.sqrt(r());
        const x = cx + Math.cos(a)*rx*d, y = cy + Math.sin(a)*ry*d;
        h += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(5+r()*9).toFixed(1)+'" fill="'+C[(r()*C.length)|0]+'" opacity="'+(0.6+r()*0.4).toFixed(2)+'"/>';
      }
    });
    svg.innerHTML = h;
  }
  sakura(document.getElementById('treeL'), 7);
  sakura(document.getElementById('treeR'), 21);

  /* ===== Падающие лепестки с лёгким размытием ===== */
  const box = document.getElementById('petals'), pr = rng(99);
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i');
    p.className = 'petal';
    p.style.left = (pr()*100).toFixed(1) + 'vw';
    p.style.setProperty('--s', (8 + pr()*9).toFixed(1) + 'px');
    p.style.setProperty('--d', (9 + pr()*9).toFixed(1) + 's');
    p.style.setProperty('--dl', (-pr()*18).toFixed(1) + 's');
    p.style.setProperty('--dx', ((pr()-0.3)*220).toFixed(0) + 'px');
    box.appendChild(p);
  }

  document.getElementById('y').textContent = new Date().getFullYear();
</script>
</body>
</html>
